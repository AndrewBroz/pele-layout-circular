<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The preview draws text from shared links. The renderer escapes
         it; this policy also blocks inline handlers and javascript: links
         in case a renderer ever lets one through. -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'" />
    <title>pele-layout-circular — playground</title>
    <meta
      name="description"
      content="Try the circular layout for Pele flowcharts: pick an example, edit it, and switch its settings."
    />
    <style>
      /* The page's own theme. The --pele-* variables are set on body by
         .theme-light and .theme-dark below, and the diagrams inherit them.
         The light values exactly match Pele's defaults (src/svg/theme.ts
         in Pele). The dark set is hand-picked, because Pele has no dark
         defaults. */
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.5rem 2rem 2rem;
        font-family: system-ui, sans-serif;
        background: var(--pele-bg);
        color: var(--pele-fg);
      }
      body.theme-light {
        --pele-bg: #ffffff;
        --pele-fg: #1f1f1f;
        --pele-muted: #6e6e6e;
        --pele-line: #1f1f1f;
        --pele-surface: #f3f3f3;
        --pele-surface-alt: #e6e6e6;
        --pele-border: #8a8a8a;
        --pele-accent: #5b7bd5;
        --error: #c22;
      }
      body.theme-dark {
        color-scheme: dark;
        --pele-bg: #16181d;
        --pele-fg: #e6e6e6;
        --pele-muted: #9a9a9a;
        --pele-line: #c8c8c8;
        --pele-surface: #262a33;
        --pele-surface-alt: #323744;
        --pele-border: #6b7280;
        --pele-accent: #7f9cf5;
        --error: #f77;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.25rem 1.5rem;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0;
      }
      h1 span {
        font-weight: normal;
        color: var(--pele-muted);
      }
      nav {
        display: flex;
        gap: 1rem;
        font-size: 0.9rem;
      }
      a {
        color: inherit;
      }
      .versions {
        margin-left: auto;
        font-size: 0.8rem;
        color: var(--pele-muted);
      }
      button,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        padding: 0.2rem 0.7rem;
        cursor: pointer;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem 1.5rem;
        margin-bottom: 1rem;
        font-size: 0.95rem;
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        white-space: nowrap;
        max-width: 100%;
      }
      /* An option label can be wider than a phone; the drop-down shrinks
         to fit its label instead. */
      .controls select {
        min-width: 0;
      }
      .controls label.disabled {
        opacity: 0.45;
      }
      select {
        padding: 0.2rem 0.3rem;
        border: 1px solid var(--pele-border);
        border-radius: 4px;
        background: var(--pele-bg);
      }
      code {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.8em;
        color: var(--pele-muted);
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
        gap: 1.5rem;
      }
      textarea {
        width: 100%;
        min-height: 70vh;
        padding: 0.75rem;
        border: 1px solid var(--pele-border);
        border-radius: 6px;
        background: var(--pele-bg);
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.85rem;
        line-height: 1.45;
        resize: vertical;
        tab-size: 2;
      }
      .preview {
        border: 1px solid var(--pele-border);
        border-radius: 6px;
        padding: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
      }
      .preview svg {
        max-width: 100%;
        height: auto;
      }
      .error {
        color: var(--error);
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
      }
      @media (max-width: 760px) {
        body {
          padding: 1rem;
        }
        main {
          grid-template-columns: minmax(0, 1fr);
        }
        textarea {
          min-height: 16rem;
        }
        .preview {
          min-height: 20rem;
        }
        .versions {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body class="theme-light">
    <header>
      <h1>pele-layout-circular <span>playground</span></h1>
      <nav>
        <a href="https://github.com/AndrewBroz/pele-layout-circular#readme">README</a>
        <a href="gallery.html">Gallery</a>
        <a href="https://www.npmjs.com/package/pele-layout-circular">npm</a>
      </nav>
      <button id="theme" type="button">Switch to dark</button>
      <span class="versions" id="versions"></span>
    </header>
    <div class="controls">
      <label>Example <select id="example"></select></label>
      <label><input type="checkbox" id="circular" /> Circular <code id="layout-line">layout: circular</code></label>
      <label>
        <select id="direction" aria-label="Direction">
          <option value="circular">Clockwise</option>
          <option value="circular-ccw">Counter-clockwise</option>
        </select>
      </label>
      <label><input type="checkbox" id="straight" /> Straight edges <code>curve: linear</code></label>
    </div>
    <main>
      <textarea
        id="editor"
        aria-label="Diagram text"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        wrap="off"
      ></textarea>
      <div class="preview" id="preview" aria-live="polite"></div>
    </main>
    <script type="module" src="./playground.ts"></script>
  </body>
</html>
